workflows:
  react-native-android:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Expo prebuild (genera la carpeta android/)
        script: npx expo prebuild --platform android --no-install
      - name: local.properties con la ruta del SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Compilar APK de debug
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
